<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Vanilla WebGL!</title>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
        background-image: url(https://cs460.org/gfx/bg.gif);
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }

      #c {
        width: 100%;
        height: 100%;
      }

      #scoreboard {
        position: absolute;
        top: 10px;
        right: 10px;
        color: #ffffff;
        font-family: monospace, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000000;
        z-index: 10;
      }
    </style>
  </head>
  <script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>
  
  <script id="vertexshader" type="glsl">
    attribute vec3 a_position;

    uniform vec3 u_offset;

    void main(void) {

      vec3 final_position = a_position;
      final_position.x += u_offset.x;
      final_position.y += u_offset.y;
      final_position.z += u_offset.z;
    
      gl_Position = vec4( final_position, 1.);
      gl_PointSize = 20.0;
    
    }
  </script>
  
  <script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;

    void main(void) {

      gl_FragColor = u_color;

    }
  </script>
  
  <script>

    var c, gl;
    var v_shader, f_shader, shaderprogram;
    var vertices, indices, v_buffer, i_buffer;

    var step_x = 0.0;
    var step_y = 0.0;
    var obstacle_factor = 3; // Hint for the bonus!
    var direction_y = 0;
    var direction_x = 0;
    var objects = [];


    window.onload = function() {

      //************************************************************//
      //
      // INITIALIZE WEBGL
      //
      c = document.getElementById( 'c' ); // setup canvas
      c.width = window.innerWidth;
      c.height = window.innerHeight;

      gl = c.getContext( 'webgl' ); // setup GL context
      gl.viewport(0, 0, c.width, c.height );


      //************************************************************//
      //
      // SHADERS
      //
      v_shader = gl.createShader( gl.VERTEX_SHADER );
      f_shader = gl.createShader( gl.FRAGMENT_SHADER );
      
      // compile vertex shader
      var vs_source = document.getElementById( 'vertexshader' ).textContent || document.getElementById( 'vertexshader' ).innerText;
      gl.shaderSource( v_shader, vs_source );
      gl.compileShader( v_shader );

      if (!gl.getShaderParameter( v_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( v_shader ));
      }

      // compile fragment shader
      var fs_source = document.getElementById( 'fragmentshader' ).textContent || document.getElementById( 'fragmentshader' ).innerText;
      gl.shaderSource( f_shader, fs_source );
      gl.compileShader( f_shader );

      if (!gl.getShaderParameter( f_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( f_shader ));
      }

      // attach and link the shaders
      shaderprogram = gl.createProgram();
      gl.attachShader( shaderprogram, v_shader );
      gl.attachShader( shaderprogram, f_shader );

      gl.linkProgram( shaderprogram );

      gl.useProgram( shaderprogram );


      // create multiple objects
      objects = [];
      objects.push( createAirplane());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());
      objects.push( createObstacle());

      animate();

    };



    function createAirplane() {

      //
      // Part 1 Starts
      //
      // Define unique vertices for airplane facing right (+x), centered at (0,0,0)
      var vertices = new Float32Array([
         0.06,  0.00,  0.0, // V0: Nose tip
         0.02,  0.015, 0.0, // V1: Cockpit / top fuselage front
         0.02, -0.015, 0.0, // V2: Bottom fuselage front
         0.00,  0.00,  0.0, // V3: Airplane center
        -0.01,  0.075, 0.0, // V4: Top wing tip
        -0.03,  0.015, 0.0, // V5: Top wing rear / fuselage back top
        -0.01, -0.075, 0.0, // V6: Bottom wing tip
        -0.03, -0.015, 0.0, // V7: Bottom wing rear / fuselage back bottom
        -0.06,  0.00,  0.0, // V8: Tail base
        -0.07,  0.045, 0.0, // V9: Top tail fin tip
        -0.07, -0.045, 0.0  // V10: Bottom tail fin tip
      ]);

      var v_buffer = gl.createBuffer();
      gl.bindBuffer( gl.ARRAY_BUFFER, v_buffer );
      gl.bufferData( gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW );
      gl.bindBuffer( gl.ARRAY_BUFFER, null );

      //
      // Part 1 Ends
      //

      var offset = [0.,0.,0.];
      var color = [0.,0.,0.,1.];

      //
      // Bonus Part 3!
      //
      // Triangle indices (8 triangles = 24 vertex indices)
      var indices = new Uint8Array([
        0, 2, 1,   // Nose cone
        1, 2, 3,   // Body front
        1, 5, 4,   // Top wing
        2, 6, 7,   // Bottom wing
        3, 7, 5,   // Body mid
        5, 7, 8,   // Tail cone
        5, 8, 9,   // Upper tail fin
        7, 10, 8   // Lower tail fin
      ]);

      var i_buffer = gl.createBuffer();
      gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, i_buffer );
      gl.bufferData( gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW );
      gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, null );

      return ['airplane', v_buffer, vertices, offset, color, gl.TRIANGLES, i_buffer, indices];

    }



    function createObstacle() {

      var vertices = new Float32Array( [ 0.0, 0.0, 0.0 ]);

      var v_buffer = gl.createBuffer(); // create
      gl.bindBuffer( gl.ARRAY_BUFFER, v_buffer ); // bind
      gl.bufferData( gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW ); // put data in
      gl.bindBuffer( gl.ARRAY_BUFFER, null ); // unbind

      //
      // Part 2 Starts
      //
      var ox = Math.random() * 2.0 - 1.0;
      var oy = Math.random() * 2.0 - 1.0;
      // Ensure obstacle does not spawn directly on top or right in front of the airplane at startup
      while (Math.abs(ox) < 0.35 && Math.abs(oy) < 0.25) {
        ox = Math.random() * 2.0 - 1.0;
        oy = Math.random() * 2.0 - 1.0;
      }
      var offset = [ox, oy, 0.];

      //
      // Part 2 Ends
      //

      var color = [Math.random(),Math.random(),Math.random(),1.];

      return ['obstacle', v_buffer, vertices, offset, color, gl.POINTS];

    }



    //
    // Part 3 Starts (no coding required, just explanations in PDF)
    //
    function calculateBoundingBox(vertices, offset) {

      var minx = 1000;
      var maxx = -1000;
      var miny = 1000;
      var maxy = -1000;
      var minz = 1000;
      var maxz = -1000;

      for (var v=0; v<vertices.length; v+=3) {

        var currentx = vertices[v] + offset[0];
        var currenty = vertices[v+1] + offset[1];
        var currentz = vertices[v+2] + offset[2];

        minx = Math.min( minx, currentx );
        miny = Math.min( miny, currenty );
        minz = Math.min( minz, currentz );

        maxx = Math.max( maxx, currentx );
        maxy = Math.max( maxy, currenty );
        maxz = Math.max( maxz, currentz );

      }

      return [minx, maxx, miny, maxy, minz, maxz];

    }

    function detectCollision(bbox, point) {

      var collision = false;

      if (point[0] >= bbox[0] && point[0] <= bbox[1]) {
        if (point[1] >= bbox[2] && point[1] <= bbox[3]) {
          if (point[2] >= bbox[4] && point[2] <= bbox[5]) {

            collision = true;

          }
        }
      }

      return collision;

    }
    //
    // Part 3 Ends
    //



    //
    // Part 4 Starts
    //
    var game_over = false;

    function handleKey(e) {

      var code = e.keyCode || e.which;
      var key = e.key;

      if (game_over) {
        // Restart the game if over
        game_over = false;
        direction_x = 0;
        direction_y = 0;
        step_x = 0.0;
        step_y = 0.0;
        obstacle_factor = 3;
        framecounter = 0;
        document.getElementById('scoreboard').innerHTML = '0';
        objects[0][3] = [0., 0., 0.];
        for (var i = 1; i < objects.length; i++) {
          var rox = Math.random() * 2.0 - 1.0;
          var roy = Math.random() * 2.0 - 1.0;
          while (Math.abs(rox) < 0.35 && Math.abs(roy) < 0.25) {
            rox = Math.random() * 2.0 - 1.0;
            roy = Math.random() * 2.0 - 1.0;
          }
          objects[i][3] = [rox, roy, 0.];
        }
        requestAnimationFrame(animate);
      }

      if ( code == 38 || key == 'ArrowUp' || key == 'w' || key == 'W' ) {
        // player pressed up
        step_x = 0.0;
        step_y = 0.02;
        direction_x = 0;
        direction_y = 1;
        if (e.preventDefault) e.preventDefault();

      } else if (code == 40 || key == 'ArrowDown' || key == 's' || key == 'S' ) {
        // player pressed down
        step_x = 0.0;
        step_y = 0.02;
        direction_x = 0;
        direction_y = -1;
        if (e.preventDefault) e.preventDefault();

      } else if (code == 37 || key == 'ArrowLeft' || key == 'a' || key == 'A' ) {
        // player pressed left
        step_x = 0.02;
        step_y = 0.0;
        direction_x = -1;
        direction_y = 0;
        if (e.preventDefault) e.preventDefault();

      } else if (code == 39 || key == 'ArrowRight' || key == 'd' || key == 'D' ) {
        // player pressed right
        step_x = 0.02;
        step_y = 0.0;
        direction_x = 1;
        direction_y = 0;
        if (e.preventDefault) e.preventDefault();

      }

    }

    window.onkeyup = handleKey;
    window.onkeydown = handleKey;
    document.onkeyup = handleKey;
    document.onkeydown = handleKey;
    window.addEventListener('keydown', handleKey, false);
    window.addEventListener('keyup', handleKey, false);
    //
    // Part 4 Ends
    //




    var framecounter = 0;

    function animate() {

      framecounter += 1;

      if (framecounter > 150) {

        // roughly every five seconds with 30 FPS

        // update score
        document.getElementById('scoreboard').innerHTML = parseInt(document.getElementById('scoreboard').innerHTML) + 100;

        //
        // Bonus Part 2!
        //
        obstacle_factor += 1;

        framecounter = 0;

      }

      gl.clearColor( 0., 0., 0., 0.);
      gl.clear( gl.COLOR_BUFFER_BIT );



      for( var o = 0; o < objects.length; o++ ) {

        var current_objecttype = objects[o][0];
        var current_v_buffer = objects[o][1];
        var current_vertices = objects[o][2];
        var current_offset = objects[o][3];
        var current_color = objects[o][4];
        var current_drawtype = objects[o][5];

        var current_v_count = current_vertices.length;
        
        if (current_objecttype == 'airplane') {

          // update offsets
          if ( current_offset[0] <= -1. ) {
            // bumped into left end of screen
            direction_x = 1;
          } else if ( current_offset[0] >= 1. ) {
            // bumped into right end of screen
            direction_x = -1;
          }
          current_offset[0] += direction_x*step_x;

          if ( current_offset[1] <= -1. ) {
            // bumped into bottom end of screen
            direction_y = 1;
          } else if ( current_offset[1] >= 1. ) {
            // bumped into top end of screen
            direction_y = -1;
          }
          current_offset[1] += direction_y*step_y;


          // get the bounding box of this airplane
          var bbox_plane = calculateBoundingBox( current_vertices, current_offset);


        } else if (current_objecttype == 'obstacle') {


          //
          // Bonus Part 1!
          //
          current_offset[0] -= 0.005 * obstacle_factor;

          // Wrap around to right side when obstacle goes off screen
          if (current_offset[0] < -1.0) {
            current_offset[0] = 1.0;
            current_offset[1] = Math.random() * 2.0 - 1.0;
          }

          // collision detection using the bounding box of this airplane
          if (detectCollision(bbox_plane, current_offset)) {

            document.getElementById('scoreboard').innerHTML += ' AND...GAME OVER! (Press any arrow key to restart)';
            game_over = true;

            return;

          }


        }


        //************************************************************//
        //
        // CONNECT SHADER WITH GEOMETRY
        //
        
        gl.bindBuffer( gl.ARRAY_BUFFER, current_v_buffer );

        // Bonus Part 3: bind element array buffer if available
        var current_i_buffer = objects[o][6];
        var current_indices = objects[o][7];
        if (current_i_buffer) {
          gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, current_i_buffer );
        } else {
          gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, null );
        }

        // find the attribute in the shader source
        var a_position = gl.getAttribLocation( shaderprogram, 'a_position' );

        gl.vertexAttribPointer( a_position, 3, gl.FLOAT, false, 0, 0 );

        gl.enableVertexAttribArray ( a_position );

        // find the uniform in the shader source
        var u_offset = gl.getUniformLocation( shaderprogram, 'u_offset' );

        gl.uniform3fv( u_offset, new Float32Array(current_offset) );

        var u_color = gl.getUniformLocation( shaderprogram, 'u_color' );
        
        gl.uniform4fv( u_color, new Float32Array(current_color) );

        //************************************************************//
        //
        // DRAW!
        //

        //
        // Bonus Part 3!
        //
        if (current_i_buffer) {
          gl.drawElements( current_drawtype, current_indices.length, gl.UNSIGNED_BYTE, 0 );
        } else {
          gl.drawArrays( current_drawtype, 0, current_v_count/3 );
        }

      }


      requestAnimationFrame(animate);

    };

  </script>
  <body>
    <canvas id="c"></canvas>
    <div id="scoreboard">0</div>
  </body>
</html>
