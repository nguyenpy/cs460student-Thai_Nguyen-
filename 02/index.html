<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moving Sketch Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Moving Sketch Cube with Flying Colors</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Set up scene, camera, renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Load the sketch as a texture
        const textureLoader = new THREE.TextureLoader();
        
        // We load the texture. When using file:// protocol, CORS might block it. 
        // Best viewed via a local web server (e.g. python -m http.server)
        const texture = textureLoader.load('cube.jpeg'); 

        // Create the cube
        const geometry = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const material = new THREE.MeshBasicMaterial({ map: texture });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Create flying colors (Particles)
        const particlesCount = 1500;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);
        const particlesColors = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles around
            particlesPositions[i] = (Math.random() - 0.5) * 12;
            
            // Random vibrant colors
            particlesColors[i] = Math.random() * 0.8 + 0.2; // Avoid too dark colors
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(particlesColors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 6;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate cube
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;

            // Rotate and gently move particles
            particlesMesh.rotation.y -= 0.002;
            particlesMesh.rotation.x += 0.001;

            // Optional: making the particles "breathe" or move slightly
            const time = Date.now() * 0.00005;
            for (let i = 0; i < particlesCount; i++) {
                const i3 = i * 3;
                particlesGeometry.attributes.position.array[i3 + 1] += Math.sin(time + particlesGeometry.attributes.position.array[i3]) * 0.005;
            }
            particlesGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
